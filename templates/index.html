<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BYD Logistics Search</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <style>
    [x-cloak] { display: none !important; }
    @media print {
      .no-print { display: none !important; }
      .print-area { border: none !important; box-shadow: none !important; padding: 0 !important; }
      #printOnlyArea { display: block !important; }
    }
    .loader { border: 3px solid #e5e7eb; border-top-color: #3b82f6; border-radius: 50%; width: 20px; height: 20px; animation: spin .6s linear infinite; display: inline-block; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .print-card { border: 1px solid #d1d5db; border-radius: 8px; padding: 16px; margin-bottom: 12px; }
    .print-card h3 { font-size: 15px; font-weight: 700; margin-bottom: 10px; color: #1e40af; border-bottom: 2px solid #3b82f6; padding-bottom: 6px; }
    .print-card .field-row { display: flex; padding: 4px 0; border-bottom: 1px solid #f3f4f6; font-size: 13px; }
    .print-card .field-label { font-weight: 600; color: #374151; min-width: 180px; flex-shrink: 0; }
    .print-card .field-value { color: #111827; }
  </style>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen" x-data="app()" x-init="init()" x-cloak>

  <header class="bg-white border-b shadow-sm no-print">
    <div class="max-w-[1600px] mx-auto px-4 py-3 flex items-center justify-between">
      <h1 class="text-xl font-bold text-blue-700 tracking-wide" x-text="t('title')"></h1>
      <div class="flex items-center gap-3">
        <div class="flex border rounded-md overflow-hidden text-xs">
          <button class="px-2 py-1 transition" :class="lang==='zh' ? 'bg-blue-600 text-white' : 'hover:bg-gray-100'" @click="setLang('zh')">中文</button>
          <button class="px-2 py-1 transition" :class="lang==='en' ? 'bg-blue-600 text-white' : 'hover:bg-gray-100'" @click="setLang('en')">EN</button>
          <button class="px-2 py-1 transition" :class="lang==='es' ? 'bg-blue-600 text-white' : 'hover:bg-gray-100'" @click="setLang('es')">ES</button>
        </div>
      </div>
    </div>
  </header>

  <main class="max-w-[1600px] mx-auto px-4 py-4 flex gap-4 no-print" style="min-height:calc(100vh - 60px)">

    <!-- ══════ Left Sidebar ══════ -->
    <aside class="w-72 flex-shrink-0 space-y-4">
      <section class="bg-white rounded-lg shadow p-4">
        <h2 class="font-semibold text-sm text-gray-500 mb-2" x-text="'1. ' + t('selectModel')"></h2>
        <template x-for="m in models" :key="m.id">
          <button class="w-full text-left px-3 py-2 rounded-md text-sm mb-1 transition"
            :class="selectedModel === m.id ? 'bg-blue-600 text-white' : 'hover:bg-gray-100'"
            @click="selectModel(m.id)"
            x-text="m.name + (m.loaded ? '' : ' ⚠️')"></button>
        </template>
      </section>

      <section class="bg-white rounded-lg shadow p-4" x-show="selectedModel">
        <h2 class="font-semibold text-sm text-gray-500 mb-2" x-text="t('dataManagement')"></h2>
        <button class="w-full bg-blue-600 hover:bg-blue-700 text-white text-sm py-2 rounded-md mb-2 flex items-center justify-center gap-1"
                @click="loadModel('replace')" :disabled="loadingData">
          <span class="loader" x-show="loadingData"></span>
          <span x-text="loadingData ? t('loading') : t('loadRefresh')"></span>
        </button>
        <div class="border-t pt-2 mt-1">
          <label class="block text-xs text-gray-500 mb-1" x-text="t('uploadNewExcel')"></label>
          <input type="file" accept=".xlsx,.xls" class="block w-full text-xs mb-2" @change="uploadFile = $event.target.files[0]">
          <div class="flex gap-2">
            <button class="flex-1 bg-green-600 hover:bg-green-700 text-white text-xs py-1.5 rounded"
                    @click="uploadExcel('replace')" :disabled="!uploadFile || uploading" x-text="t('replace')"></button>
            <button class="flex-1 bg-amber-500 hover:bg-amber-600 text-white text-xs py-1.5 rounded"
                    @click="uploadExcel('append')" :disabled="!uploadFile || uploading" x-text="t('append')"></button>
          </div>
          <p class="text-xs text-gray-400 mt-1" x-show="uploading" x-text="t('uploading')"></p>
        </div>
      </section>

      <section class="bg-white rounded-lg shadow p-4" x-show="sheets.length > 0">
        <h2 class="font-semibold text-sm text-gray-500 mb-2" x-text="'2. ' + t('selectSheet')"></h2>
        <template x-for="s in sheets" :key="s.table_name">
          <button class="w-full text-left px-3 py-1.5 rounded-md text-sm mb-1 transition flex justify-between items-center"
            :class="selectedSheet?.table_name === s.table_name ? 'bg-blue-600 text-white' : 'hover:bg-gray-100'"
            @click="selectSheet(s)">
            <span x-text="s.sheet_name"></span>
            <span class="text-xs opacity-70" x-text="s.row_count + ' ' + t('rows')"></span>
          </button>
        </template>
      </section>

      <section class="bg-white rounded-lg shadow p-4 max-h-72 overflow-y-auto" x-show="selectedSheet">
        <div class="flex items-center justify-between mb-2">
          <h2 class="font-semibold text-sm text-gray-500" x-text="'4. ' + t('displayColumns')"></h2>
          <div class="flex gap-1">
            <button class="text-xs text-blue-600 hover:underline" @click="visibleCols = [...selectedSheet.columns]" x-text="t('selectAll')"></button>
            <button class="text-xs text-blue-600 hover:underline" @click="visibleCols = []" x-text="t('clearAll')"></button>
          </div>
        </div>
        <template x-for="col in selectedSheet?.columns || []" :key="col">
          <label class="flex items-center gap-1.5 text-xs py-0.5 cursor-pointer">
            <input type="checkbox" :value="col" x-model="visibleCols" class="rounded text-blue-600">
            <span x-text="col" class="truncate"></span>
          </label>
        </template>
      </section>
    </aside>

    <!-- ══════ Main Content ══════ -->
    <div class="flex-1 flex flex-col gap-4 min-w-0">
      <section class="bg-white rounded-lg shadow p-4" x-show="selectedSheet">
        <h2 class="font-semibold text-sm text-gray-500 mb-2">3. <span x-text="t('search')"></span> <span class="font-normal text-gray-400" x-text="'(' + t('searchHint') + ')'"></span></h2>
        <div class="flex gap-2">
          <input type="text" x-model="query" @keydown.enter="doSearch()"
                 :placeholder="t('searchPlaceholder')"
                 class="flex-1 border border-gray-300 rounded-md px-3 py-2 text-sm focus:ring-2 focus:ring-blue-400 outline-none">
          <button class="bg-blue-600 hover:bg-blue-700 text-white px-5 py-2 rounded-md text-sm flex items-center gap-1"
                  @click="doSearch()" :disabled="searching">
            <span class="loader" x-show="searching"></span>
            <span x-text="t('searchBtn')"></span>
          </button>
        </div>
      </section>

      <section class="bg-white rounded-lg shadow flex-1 flex flex-col min-h-0" x-show="searchResult">
        <div class="p-4 border-b flex items-center justify-between flex-shrink-0">
          <h2 class="font-semibold text-sm text-gray-500"><span x-text="t('searchResults')"></span> <span class="text-blue-600" x-text="'(' + (searchResult?.total || 0) + ')'"></span></h2>
          <div class="flex items-center gap-3">
            <label class="flex items-center gap-1 text-xs text-gray-500">
              <input type="checkbox" @change="toggleSelectAll($event.target.checked)"> <span x-text="t('selectAll')"></span>
            </label>
            <button class="bg-blue-600 hover:bg-blue-700 text-white text-xs px-3 py-1 rounded flex items-center gap-1"
                    @click="openPreviewPanel()">
              <span x-text="t('showTemplatePanel')"></span>
            </button>
          </div>
        </div>
        <div class="overflow-auto flex-1 p-2">
          <table class="w-full text-xs border-collapse" x-show="filteredRows().length">
            <thead>
              <tr class="bg-gray-100 sticky top-0">
                <th class="px-2 py-1 border text-center w-8">
                  <input type="checkbox" @change="toggleSelectAll($event.target.checked)">
                </th>
                <template x-for="col in displayCols()" :key="col">
                  <th class="px-2 py-1 border text-left font-medium whitespace-nowrap" x-text="col"></th>
                </template>
              </tr>
            </thead>
            <tbody>
              <template x-for="row in filteredRows()" :key="row._id">
                <tr class="hover:bg-blue-50 transition cursor-pointer"
                    :class="selectedRows.has(row._id) ? 'bg-blue-100' : ''"
                    @click="toggleRow(row._id)">
                  <td class="px-2 py-1 border text-center">
                    <input type="checkbox" :checked="selectedRows.has(row._id)" @click.stop="toggleRow(row._id)">
                  </td>
                  <template x-for="col in displayCols()" :key="col">
                    <td class="px-2 py-1 border max-w-xs truncate" :title="row[col]" x-text="row[col]"></td>
                  </template>
                </tr>
              </template>
            </tbody>
          </table>
          <p class="text-center text-gray-400 py-8" x-show="searchResult && filteredRows().length === 0" x-text="t('noResults')"></p>
        </div>
      </section>
    </div>

    <!-- ══════ Right Panel – Template & Preview ══════ -->
    <aside class="w-[420px] flex-shrink-0 space-y-4 transition-all" x-show="showTemplatePanel" x-cloak>

      <!-- Template config (simple mode) -->
      <section class="bg-white rounded-lg shadow p-4">
        <div class="flex items-center justify-between mb-3">
          <h2 class="font-semibold text-sm text-gray-500" x-text="'5. ' + t('printTemplate')"></h2>
          <div class="flex items-center gap-2">
            <button class="text-xs px-2 py-0.5 rounded" :class="tplMode==='simple' ? 'bg-blue-600 text-white' : 'bg-gray-100'" @click="tplMode='simple'" x-text="t('simpleMode')"></button>
            <button class="text-xs px-2 py-0.5 rounded" :class="tplMode==='advanced' ? 'bg-blue-600 text-white' : 'bg-gray-100'" @click="tplMode='advanced'" x-text="t('advancedMode')"></button>
            <button class="text-xs text-gray-400 hover:text-red-500" @click="showTemplatePanel = false">&#10005;</button>
          </div>
        </div>

        <!-- Simple Mode: field selector -->
        <div x-show="tplMode === 'simple'">
          <label class="block text-xs text-gray-500 mb-1" x-text="t('pickOutputFields')"></label>
          <div class="max-h-48 overflow-y-auto border rounded p-2 mb-2">
            <template x-for="col in selectedSheet?.columns || []" :key="'tpl_'+col">
              <label class="flex items-center gap-1.5 text-xs py-0.5 cursor-pointer">
                <input type="checkbox" :value="col" x-model="tplFields" class="rounded text-blue-600"
                       @change="autoPreview()">
                <span x-text="col" class="truncate"></span>
              </label>
            </template>
          </div>
          <div class="flex gap-2 mb-2">
            <button class="text-xs text-blue-600 hover:underline" @click="tplFields = [...visibleCols]; autoPreview()" x-text="t('useVisibleCols')"></button>
            <button class="text-xs text-blue-600 hover:underline" @click="tplFields = [...(selectedSheet?.columns || [])]; autoPreview()" x-text="t('selectAll')"></button>
            <button class="text-xs text-blue-600 hover:underline" @click="tplFields = []; autoPreview()" x-text="t('clearAll')"></button>
          </div>
        </div>

        <!-- Advanced Mode: raw template editor -->
        <div x-show="tplMode === 'advanced'">
          <div class="flex gap-2 mb-2">
            <select class="flex-1 border rounded text-sm px-2 py-1" x-model="selectedTemplateId" @change="loadTemplate()">
              <option value="" x-text="'-- ' + t('selectTemplate') + ' --'"></option>
              <template x-for="tmpl in templates" :key="tmpl.id">
                <option :value="tmpl.id" x-text="tmpl.name"></option>
              </template>
            </select>
            <button class="text-xs bg-green-600 text-white px-2 rounded hover:bg-green-700" @click="newTemplate()" x-text="t('newBtn')"></button>
          </div>
          <input type="text" x-model="tplName" :placeholder="t('templateName')" class="w-full border rounded text-sm px-2 py-1 mb-2">
          <textarea x-model="tplBody" rows="8" :placeholder="t('templateBodyHint')"
                    class="w-full border rounded text-sm px-2 py-1 font-mono leading-relaxed"></textarea>
          <details class="mt-1">
            <summary class="text-xs text-gray-400 cursor-pointer" x-text="t('availableColumns')"></summary>
            <div class="flex flex-wrap gap-1 mt-1 max-h-28 overflow-y-auto">
              <template x-for="col in selectedSheet?.columns || []" :key="'adv_'+col">
                <button class="text-xs bg-gray-100 hover:bg-blue-100 px-1.5 py-0.5 rounded border"
                        @click="insertCol(col)" x-text="col"></button>
              </template>
            </div>
          </details>
          <div class="flex gap-2 mt-2">
            <button class="flex-1 bg-blue-600 hover:bg-blue-700 text-white text-sm py-1.5 rounded" @click="saveCurrentTemplate()" x-text="t('saveTemplate')"></button>
            <button class="bg-red-500 hover:bg-red-600 text-white text-sm px-3 py-1.5 rounded" @click="deleteCurrentTemplate()"
                    x-show="selectedTemplateId" x-text="t('deleteBtn')"></button>
          </div>
        </div>
      </section>

      <!-- Preview & Print -->
      <section class="bg-white rounded-lg shadow p-4">
        <div class="flex items-center justify-between mb-2">
          <h2 class="font-semibold text-sm text-gray-500" x-text="'6. ' + t('previewAndPrint')"></h2>
          <div class="flex gap-2">
            <button class="text-xs bg-blue-600 text-white px-3 py-1 rounded hover:bg-blue-700" @click="renderPreview()" x-text="t('previewBtn')"></button>
            <button class="text-xs bg-gray-700 text-white px-3 py-1 rounded hover:bg-gray-800" @click="doPrint()" x-text="t('printBtn')"></button>
            <button class="text-xs bg-green-600 text-white px-3 py-1 rounded hover:bg-green-700" @click="copyToClipboard()" x-text="t('copyBtn')"></button>
          </div>
        </div>
        <div class="border rounded p-3 min-h-[150px] max-h-[50vh] overflow-y-auto text-sm leading-relaxed print-area bg-white" id="printArea"
             x-html="previewHtml || '<span class=\'text-gray-400\'>' + t('previewHint') + '</span>'">
        </div>
      </section>
    </aside>
  </main>

  <div class="hidden print:block p-6" id="printOnlyArea"></div>

  {% raw %}<script>

    function app() {
      return {
        lang: localStorage.getItem('byd_lang') || 'zh',
        t(key) { return (I18N[this.lang] || I18N.zh)[key] || key; },
        setLang(l) { this.lang = l; localStorage.setItem('byd_lang', l); document.title = this.t('title'); },

        models: [], selectedModel: null, sheets: [], selectedSheet: null,
        query: '', searchResult: null, selectedRows: new Set(), visibleCols: [],
        showTemplatePanel: false,
        templates: [], selectedTemplateId: '', tplName: '', tplBody: '',
        tplMode: 'simple',
        tplFields: [],
        previewHtml: '',
        loadingData: false, searching: false, uploadFile: null, uploading: false,

        async init() {
          document.title = this.t('title');
          await this.fetchModels();
          await this.fetchTemplates();
        },

        async fetchModels() { this.models = await (await fetch('/api/models')).json(); },

        async selectModel(id) {
          this.selectedModel = id;
          this.selectedSheet = null; this.searchResult = null; this.sheets = [];
          this.sheets = await (await fetch(`/api/models/${id}/sheets`)).json();
        },

        async loadModel(mode) {
          if (!this.selectedModel) return;
          this.loadingData = true;
          try {
            const res = await fetch(`/api/models/${this.selectedModel}/load`, {
              method: 'POST', headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ mode }),
            });
            const data = await res.json();
            if (data.ok) {
              this.sheets = data.sheets; this.selectedSheet = null; this.searchResult = null;
              await this.fetchModels();
            } else { alert(data.error || this.t('loadFailed')); }
          } finally { this.loadingData = false; }
        },

        async uploadExcel(mode) {
          if (!this.uploadFile || !this.selectedModel) return;
          this.uploading = true;
          try {
            const fd = new FormData(); fd.append('file', this.uploadFile); fd.append('mode', mode);
            const data = await (await fetch(`/api/models/${this.selectedModel}/upload`, { method: 'POST', body: fd })).json();
            if (data.ok) {
              this.sheets = data.sheets; this.selectedSheet = null; this.searchResult = null;
              this.uploadFile = null; await this.fetchModels();
              alert(this.t('uploadSuccess'));
            } else { alert(data.error || this.t('uploadFailed')); }
          } finally { this.uploading = false; }
        },

        selectSheet(s) {
          this.selectedSheet = s; this.visibleCols = [...s.columns];
          this.searchResult = null; this.selectedRows = new Set();
          this.tplFields = [];
        },

        async doSearch() {
          if (!this.selectedSheet || !this.query.trim()) return;
          this.searching = true; this.selectedRows = new Set();
          try {
            const params = new URLSearchParams({ table: this.selectedSheet.table_name, q: this.query.trim(), limit: 200 });
            this.searchResult = await (await fetch(`/api/search?${params}`)).json();
          } finally { this.searching = false; }
        },

        displayCols() {
          if (!this.selectedSheet) return [];
          return this.visibleCols.length === 0 ? this.selectedSheet.columns : this.visibleCols;
        },
        filteredRows() { return this.searchResult?.rows || []; },

        toggleRow(id) {
          const s = new Set(this.selectedRows);
          if (s.has(id)) s.delete(id); else s.add(id);
          this.selectedRows = s;
          if (this.showTemplatePanel) this.autoPreview();
        },
        toggleSelectAll(checked) {
          this.selectedRows = checked ? new Set(this.filteredRows().map(r => r._id)) : new Set();
          if (this.showTemplatePanel) this.autoPreview();
        },

        getSelectedRowData() {
          return this.filteredRows()
            .filter(r => this.selectedRows.has(r._id))
            .map(r => {
              const obj = {};
              for (const c of this.selectedSheet.columns) obj[c] = r[c] || '';
              return obj;
            });
        },

        // ── Template panel ──
        openPreviewPanel() {
          if (this.selectedRows.size === 0) {
            this.selectedRows = new Set(this.filteredRows().map(r => r._id));
          }
          if (this.tplFields.length === 0) {
            this.tplFields = [...this.visibleCols];
          }
          this.showTemplatePanel = true;
          this.$nextTick(() => this.autoPreview());
        },

        autoPreview() {
          const rows = this.getSelectedRowData();
          if (rows.length === 0) { this.previewHtml = ''; return; }

          if (this.tplMode === 'simple') {
            const fields = this.tplFields.length > 0 ? this.tplFields : this.displayCols();
            let html = '';
            rows.forEach((row, idx) => {
              html += '<div class="print-card">';
              html += `<h3>${this.t('orderInfo')} #${idx + 1}</h3>`;
              fields.forEach(f => {
                const val = row[f] || '';
                if (val) {
                  html += `<div class="field-row"><span class="field-label">${f}</span><span class="field-value">${val}</span></div>`;
                }
              });
              html += '</div>';
            });
            this.previewHtml = html;
          } else {
            this.renderPreview();
          }
        },

        // ── Saved templates (advanced) ──
        async fetchTemplates() { this.templates = await (await fetch('/api/templates')).json(); },
        async loadTemplate() {
          if (!this.selectedTemplateId) { this.tplName = ''; this.tplBody = ''; return; }
          const tpl = await (await fetch(`/api/templates/${this.selectedTemplateId}`)).json();
          this.tplName = tpl.name || ''; this.tplBody = tpl.body || '';
        },
        newTemplate() { this.selectedTemplateId = ''; this.tplName = ''; this.tplBody = ''; },
        insertCol(col) { this.tplBody += `{{${col}}}`; },
        async saveCurrentTemplate() {
          const payload = { name: this.tplName, body: this.tplBody };
          let url = '/api/templates', method = 'POST';
          if (this.selectedTemplateId) { url = `/api/templates/${this.selectedTemplateId}`; method = 'PUT'; }
          const tpl = await (await fetch(url, { method, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) })).json();
          this.selectedTemplateId = tpl.id; await this.fetchTemplates();
        },
        async deleteCurrentTemplate() {
          if (!this.selectedTemplateId || !confirm(this.t('confirmDelete'))) return;
          await fetch(`/api/templates/${this.selectedTemplateId}`, { method: 'DELETE' });
          this.selectedTemplateId = ''; this.tplName = ''; this.tplBody = '';
          await this.fetchTemplates();
        },

        async renderPreview() {
          const rows = this.getSelectedRowData();
          if (rows.length === 0) { alert(this.t('selectRowsFirst')); return; }
          const data = await (await fetch('/api/render', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ body: this.tplBody, rows }),
          })).json();
          this.previewHtml = data.html || data.error || '';
        },

        doPrint() {
          const area = document.getElementById('printArea');
          const printOnly = document.getElementById('printOnlyArea');
          printOnly.innerHTML = area.innerHTML;
          window.print();
        },

        async copyToClipboard() {
          const text = document.getElementById('printArea').innerText;
          try { await navigator.clipboard.writeText(text); }
          catch { document.execCommand('copy'); }
          alert(this.t('copiedToClipboard'));
        },
      };
    }
  </script>{% endraw %}
